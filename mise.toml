# Everything here runs against a local Tesserae checkout: the plugin contract is
# the host's, so the only honest test harness is the host itself.
[env]
TESSERAE_ROOT = "{{env.HOME}}/Projects/TiagoJMartins/tesserae"

[tasks.test]
description = "Run the bundle's tests against a real Tesserae app"
raw = true
run = '"$TESSERAE_ROOT/.venv/bin/python" -m pytest -q "$@"'

[tasks.serve]
description = "Start the Tesserae dev server with this bundle loaded from a scratch data root"
raw = true
run = '''
#!/usr/bin/env bash
set -euo pipefail

# The dev server scans <data_root>/authored, so a symlink per folder is enough
# to iterate without copying files on every edit.
DATA_ROOT="${SIGNALS_DATA_ROOT:-$PWD/.dev-data}"
mkdir -p "$DATA_ROOT/authored"
for folder in signals_core signals_stat; do
  ln -snf "$PWD/$folder" "$DATA_ROOT/authored/$folder"
done

echo "data root: $DATA_ROOT"
echo "render:    http://127.0.0.1:8765/_test/render?plugin=signals_stat&size=lg"
cd "$TESSERAE_ROOT"
TESSERAE_DATA_ROOT="$DATA_ROOT" exec .venv/bin/python -m app.main --dev
'''

[tasks.shot]
description = "Capture screenshots of signals_stat from a running dev server"
raw = true
usage = '''
flag "--sizes <sizes>" help="Comma-separated cell sizes to capture" default="lg"
'''
run = '"$TESSERAE_ROOT/.venv/bin/python" scripts/shot.py --sizes "${usage_sizes:-lg}"'

[tasks.release]
description = "Tag a release, upload the install tarball, print the catalog pin"
raw = true
usage = '''
arg "<version>" help="Version to tag, e.g. 0.1.0"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
version="$usage_version"
tag="v${version}"

# Every plugin folder's manifest carries its own version; the catalog pins one
# per entry, so a mismatch means the Browse card would advertise a version the
# tarball doesn't contain.
for manifest in */plugin.json; do
  declared=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['version'])" "$manifest")
  if [ "$declared" != "$version" ]; then
    echo "$manifest declares $declared, not $version" >&2
    exit 1
  fi
done

# A GitHub source archive can't be a bundle: the host unwraps the envelope and
# then requires every remaining top-level directory to be a plugin folder, so
# scripts/ alone is enough to make the install refuse. Build the tarball the
# server actually wants - the plugin folders under one envelope, no tooling,
# no tests, no .pyc - and ship it as a release asset.
stage=$(mktemp -d)
trap 'rm -rf "$stage"' EXIT
envelope="signals-${version}"
mkdir -p "$stage/$envelope"
for folder in */plugin.json; do
  folder="${folder%/plugin.json}"
  rsync -a --exclude tests/ --exclude '__pycache__/' --exclude '*.pyc' \
    "$folder" "$stage/$envelope/"
done

tarball="$stage/${envelope}.tar.gz"
tar -C "$stage" --numeric-owner --owner=0 --group=0 -czf "$tarball" "$envelope"
sha=$(shasum -a 256 "$tarball" | cut -d" " -f1)

git rev-parse -q --verify "refs/tags/$tag" >/dev/null || git tag -a "$tag" -m "$tag"
git push -q origin "$tag"

# --clobber so re-cutting the same version replaces the asset rather than
# leaving two files a catalog pin could disagree with.
if gh release view "$tag" >/dev/null 2>&1; then
  gh release upload "$tag" "$tarball" --clobber
else
  gh release create "$tag" "$tarball" --title "$tag" --notes "Install tarball for the Tesserae catalog."
fi

repo=$(gh repo view --json nameWithOwner --jq .nameWithOwner)
url="https://github.com/${repo}/releases/download/${tag}/${envelope}.tar.gz"
printf '\ntarball_url: %s\nsha256:      %s\n' "$url" "$sha"

# Fetch it back: the pin is only good if the asset really serves those bytes.
for _ in 1 2 3 4 5; do
  remote=$(curl -sSL --fail "$url" | shasum -a 256 | cut -d" " -f1) && break
  sleep 3
done
[ "${remote:-}" = "$sha" ] || { echo "asset at $url does not match the local tarball" >&2; exit 1; }
'''
